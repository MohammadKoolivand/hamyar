# Fresh staging only. Do not overwrite an existing production configuration.
storage:
  dbPath: /var/lib/mongodb
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
net:
  port: 27017
  bindIp: 127.0.0.1
replication:
  replSetName: hodhodeh-staging-rs
security:
  authorization: enabled
  keyFile: /etc/hodhod/mongo-keyfile
