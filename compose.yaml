services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "hamyar-rs", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["hamyar-mongo:/data/db"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''try { quit(rs.status().ok === 1 ? 0 : 1) } catch { rs.initiate({_id:"hamyar-rs",members:[{_id:0,host:"127.0.0.1:27017"}]}); quit(1) }''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  hamyar-mongo:
