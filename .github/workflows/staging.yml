name: Deploy verified staging release
on:
  workflow_run:
    workflows: ["Verify HodHodeh MVP"]
    branches: [stage, staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Verify HodHodeh MVP run ID on staging
        required: true
        type: string
      activate:
        description: Activate after server preflight and backup (otherwise prepare only)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: staging-deployment
  cancel-in-progress: false
jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'stage' || github.event.workflow_run.head_branch == 'staging')) ||
      github.event_name == 'workflow_dispatch'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate successful CI provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
          EXPECTED_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || 'stage' }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          jq -e --arg branch "$EXPECTED_BRANCH" '.conclusion == "success" and .head_branch == $branch and (.event == "push" or .event == "workflow_dispatch") and .path == ".github/workflows/verify.yml"' run.json > /dev/null
          SHA=$(jq -r .head_sha run.json)
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: hodhodeh-runtime-${{ steps.source.outputs.sha }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify bundle and configure pinned SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          test "$(cat release/COMMIT)" = "$EXPECTED_SHA"
          (cd release && sha256sum -c SHA256SUMS)
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/staging_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging_key ~/.ssh/known_hosts
      - name: Inspect backup tool availability and install rights (read-only)
        env:
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_USER }}
          PORT: ${{ vars.STAGING_PORT }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$USER" =~ ^[a-z_][a-z0-9_-]*$ && "$PORT" =~ ^[0-9]+$ ]]
          SSH_ARGS=(-i "$HOME/.ssh/staging_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${SSH_ARGS[@]}" -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "OS=$( . /etc/os-release; echo "$ID-$VERSION_ID" ) ARCH=$(uname -m)"
          if command -v node >/dev/null; then echo "NODE_AVAILABLE"; else echo "NODE_MISSING"; fi
          if command -v mongodump >/dev/null; then echo "MONGODUMP_AVAILABLE"; else echo "MONGODUMP_MISSING"; fi
          if sudo -n -l /usr/bin/install >/dev/null 2>&1; then echo "ROOT_INSTALL_PERMISSION_AVAILABLE"; else echo "ROOT_INSTALL_PERMISSION_MISSING"; fi
          if sudo -n -l /usr/bin/apt-get >/dev/null 2>&1; then echo "ROOT_APT_PERMISSION_AVAILABLE"; else echo "ROOT_APT_PERMISSION_MISSING"; fi
          if [ -f /etc/hodhod/backup-before-release ] && [ ! -L /etc/hodhod/backup-before-release ] && [ "$(stat -c '%u:%a:%F' /etc/hodhod/backup-before-release)" = "0:700:regular file" ]; then echo "BACKUP_HOOK_ROOT_ONLY_READY"; else echo "BACKUP_HOOK_MISSING_OR_INVALID"; fi
          REMOTE
      - name: Provision real backup hook when missing and sudo permits
        env:
          SHA: ${{ steps.source.outputs.sha }}
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_USER }}
          PORT: ${{ vars.STAGING_PORT }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$USER" =~ ^[a-z_][a-z0-9_-]*$ && "$PORT" =~ ^[0-9]+$ ]]
          SSH_ARGS=(-i "$HOME/.ssh/staging_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          bash -n ops/backup-before-release.sh
          current=$(ssh "${SSH_ARGS[@]}" -p "$PORT" "$USER@$HOST" 'if [ -e /etc/hodhod/backup-before-release ]; then if [ -f /etc/hodhod/backup-before-release ] && [ ! -L /etc/hodhod/backup-before-release ] && [ "$(stat -c '%u:%a:%F' /etc/hodhod/backup-before-release)" = "0:700:regular file" ]; then echo VALID; else echo INVALID; fi; else echo MISSING; fi')
          if [[ "$current" == VALID ]]; then
            echo "BACKUP_HOOK_ALREADY_INSTALLED"
          elif [[ "$current" == INVALID ]]; then
            echo "BACKUP_HOOK_EXISTS_BUT_NEEDS_ROOT_REVIEW" >&2
            exit 1
          else
            ssh "${SSH_ARGS[@]}" -p "$PORT" "$USER@$HOST" "command -v mongodump >/dev/null && command -v node >/dev/null" || { echo "BACKUP_DEPENDENCIES_MISSING" >&2; exit 1; }
            ssh "${SSH_ARGS[@]}" -p "$PORT" "$USER@$HOST" "mkdir -p /var/lib/hodhod/incoming/$SHA"
            scp "${SSH_ARGS[@]}" -P "$PORT" ops/backup-before-release.sh "$USER@$HOST:/var/lib/hodhod/incoming/$SHA/backup-before-release.sh"
            # May fail if sudoers lacks one-time admin privilege; never bypass it.
            ssh "${SSH_ARGS[@]}" -p "$PORT" "$USER@$HOST" "sudo -n /usr/bin/install -o root -g root -m 0700 /var/lib/hodhod/incoming/$SHA/backup-before-release.sh /etc/hodhod/backup-before-release" || { echo "BACKUP_HOOK_INSTALL_NEEDS_ADMIN" >&2; exit 1; }
            echo "BACKUP_HOOK_INSTALLED"
          fi
      - name: Upload and prepare or activate
        env:
          SHA: ${{ steps.source.outputs.sha }}
          ACTIVATE: ${{ github.event_name == 'workflow_run' && 'true' || inputs.activate }}
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_USER }}
          PORT: ${{ vars.STAGING_PORT }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$USER" =~ ^[a-z_][a-z0-9_-]*$ && "$PORT" =~ ^[0-9]+$ ]]
          SSH_ARGS=(-i "$HOME/.ssh/staging_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          # Inspect storage and remove only known disposable deploy artifacts.
          ssh "${SSH_ARGS[@]}" -p "$PORT" "$USER@$HOST" "bash -s -- $SHA" < ops/cleanup-staging-artifacts.sh
          ssh "${SSH_ARGS[@]}" -p "$PORT" "$USER@$HOST" "mkdir -p /var/lib/hodhod/incoming/$SHA"
          scp "${SSH_ARGS[@]}" -P "$PORT" release/* "$USER@$HOST:/var/lib/hodhod/incoming/$SHA/"
          # Diagnose activation gates without printing environment variables or secrets.
          ssh "${SSH_ARGS[@]}" -p "$PORT" "$USER@$HOST" "bash -s -- $SHA" <<'DIAGNOSTICS'
          set -euo pipefail
          sha=$1
          current=$(readlink -f /srv/hodhod || true)
          case "$current" in /opt/hodhod/releases/*) echo "ACTIVE_RELEASE_PATH_OK";; *) echo "ACTIVE_RELEASE_PATH_INVALID";; esac
          if [[ -d "$current" ]]; then echo "ACTIVE_RELEASE_EXISTS"; else echo "ACTIVE_RELEASE_MISSING"; fi
          if [[ "$current" == "/opt/hodhod/releases/$sha" ]]; then echo "CURRENTLY_TARGET_RELEASE"; fi
          if [[ -e "/opt/hodhod/releases/$sha" ]]; then echo "TARGET_RELEASE_PATH_ALREADY_EXISTS"; else echo "TARGET_RELEASE_PATH_FREE"; fi
          if [[ -f /etc/hodhod/backup-before-release && ! -L /etc/hodhod/backup-before-release ]] && [[ "$(stat -c '%u:%a:%F' /etc/hodhod/backup-before-release)" == "0:700:regular file" ]]; then echo "BACKUP_HOOK_ROOT_ONLY_READY"; else echo "BACKUP_HOOK_MISSING_OR_INVALID"; fi
          if [[ -e /etc/hodhod/backup-before-release ]]; then
            if [[ "$(stat -c %u /etc/hodhod/backup-before-release)" == 0 ]]; then echo "BACKUP_HOOK_ROOT_OWNED"; else echo "BACKUP_HOOK_OWNER_INVALID"; fi
          fi
          DIAGNOSTICS
          ssh "${SSH_ARGS[@]}" -p "$PORT" "$USER@$HOST" "sudo -n /usr/local/sbin/hodhod-deploy $SHA $ACTIVATE"
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/staging_key ~/.ssh/known_hosts
