name: One-time delete fully merged branches
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup-merged-branches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only proven merged branch refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          branches=(
            'feature/hodhod-exam-import-foundation'
            'feature/hodhod-intelligent-exam-import'
            'feature/hodhod-password-reset-brand'
            'feature/hodhod-pdf-extraction'
            'mvp/task-003-secure-login-logout'
          )
          for branch in "${branches[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Already deleted: $branch"
              continue
            fi
            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" HEAD; then
              echo "::error::Branch has unmerged commits: $branch"
              exit 1
            fi
            git push origin --delete "$branch"
            echo "Deleted merged branch: $branch"
          done
