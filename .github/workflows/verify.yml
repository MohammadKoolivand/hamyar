name: Verify HodHodeh MVP

on:
  push:
    branches: [stage, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # - run: npm run security:scan-secrets
      - name: Install PDF text extraction for import tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run test:fast
      - run: npm run build
      - name: Package verified runtime for staging
        if: (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/staging') && github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p /tmp/hodhod-release
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.env.* \
            --exclude=.private \
            --exclude=test-results \
            --exclude=playwright-report \
            --exclude=coverage \
            -czf /tmp/hodhod-release/release.tar.gz .
          cd /tmp/hodhod-release
          sha256sum release.tar.gz > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > COMMIT
      - name: Publish verified staging runtime
        if: (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/staging') && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: hodhodeh-runtime-${{ github.sha }}
          path: /tmp/hodhod-release/
          retention-days: 14
          if-no-files-found: error
