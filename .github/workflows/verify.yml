name: Verify HodHod MVP

on:
  push:
    branches: [stage, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # - run: npm run security:scan-secrets
      - name: Install PDF text extraction for import tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run test:fast
      - run: bash -n ops/cleanup-staging-artifacts.sh
      - run: bash -n ops/backup-before-release.sh
      - run: npm run build
      - name: Package verified runtime for staging
        if: (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/staging') && github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p /tmp/hodhod-release
          # Anchor exclusions to repository root; unanchored 'output' also
          # deletes node_modules/next/dist/build/output, breaking Next.js.
          tar \
            --anchored \
            --exclude=./.git \
            --exclude=./.env \
            --exclude=./.env.* \
            --exclude=./.private \
            --exclude=./.next/cache \
            --exclude=./node_modules \
            --exclude=./tests \
            --exclude=./docs \
            --exclude=./output \
            --exclude=./.data \
            --exclude=./test-results \
            --exclude=./playwright-report \
            --exclude=./coverage \
            -czf /tmp/hodhod-release/release.tar.gz .
          # Ship the verified build and source, but install production dependencies on the target host.
          tar -tzf /tmp/hodhod-release/release.tar.gz | grep -Fx './package.json'
          tar -tzf /tmp/hodhod-release/release.tar.gz | grep -Fx './package-lock.json'
          tar -tzf /tmp/hodhod-release/release.tar.gz | grep -Fx './.next/BUILD_ID'
          if tar -tzf /tmp/hodhod-release/release.tar.gz | grep -q '^./node_modules/'; then
            echo "Release archive must not contain node_modules" >&2
            exit 1
          fi
          du -h /tmp/hodhod-release/release.tar.gz
          cd /tmp/hodhod-release
          sha256sum release.tar.gz > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > COMMIT
      - name: Publish verified staging runtime
        if: (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/staging') && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: hodhod-runtime-${{ github.sha }}
          path: /tmp/hodhod-release/
          retention-days: 14
          if-no-files-found: error

  pdf-library-integration:
    name: Resumable PDF upload and exam handoff integration
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=hamyar-rs
      MONGO_DB: hamyar_pdf_upload_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start isolated MongoDB replica set
        env:
          HODHOD_MONGO_GLIBC_TUNABLES: glibc.pthread.rseq=1
        run: |
          set -euo pipefail
          docker compose up -d mongo
          for i in $(seq 1 45); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mongo)")" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs mongo
          exit 1
      - name: Verify full PDF transfer and exam-import handoff
        run: node --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/integration/pdf-library.test.ts tests/integration/exam-public-files.test.ts
